<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Daycare</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Pet Daycare</h1>
        <nav>
            <a href="#register">Register</a>
            <a href="#login">Login</a>
            <a href="#book">Book Caretaker</a>
            <a href="#order">Order Pet Food</a>
            <a href="#info">Pet Care Info</a>
        </nav>
    </header>

    <main>
        <section id="register">
            <h2>Register</h2>
            <form id="registerForm">
                <input type="text" id="registerUsername" placeholder="Username" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </section>

        <section id="login">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </section>

        <section id="book">
            <h2>Book Caretaker</h2>
            <div id="caretakerList"></div>
        </section>

        <section id="order">
            <h2>Order Pet Food</h2>
            <div id="petFoodList"></div>
        </section>

        <section id="info">
            <h2>Pet Care Information</h2>
            <div id="petCareInfo"></div>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
